<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>craft3d viewer</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e1e6ea; font: 11px/1.5 ui-monospace, 'SF Mono', Menlo, monospace; color: #16181b; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #ui { position: fixed; right: 16px; top: 16px; width: 250px; padding: 12px 14px; background: rgba(255,255,255,.9); border: 1px solid #dfe2e6; }
      #ui h1 { font: 700 12px/1.3 ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; margin: 0 0 2px; text-transform: uppercase; }
      #ui .sub { color: #6b7178; margin-bottom: 10px; }
      #ui label { display: block; margin-top: 8px; letter-spacing: 1px; text-transform: uppercase; color: #4b5057; }
      #ui label span { float: right; color: #16181b; }
      #ui input[type=range] { width: 100%; accent-color: #e3172c; }
      #views { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
      #views button { font: inherit; font-size: 10px; padding: 4px 7px; border: 1px solid #d4d8dc; background: #fff; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
      #stats { margin-top: 10px; color: #6b7178; white-space: pre; }
      #readout { white-space: pre; font-size: 11px; line-height: 1.55; margin: 2px 0 6px; color: #16181b; }
      #readout:empty { display: none; }
      #ui.wide { width: 360px; }
      #ui.wide #readout { font-size: 10px; }
      body.nohud #ui { display: none; }
      #views button.look { margin-left: auto; border-color: #16181b; }
      body.drawing { background: #f6f3ee; }
      /* the drawing sheet (info.sheet): a border, a title block and a header line, in the drawing look only */
      #sheet { display: none; position: fixed; inset: 14px; border: 1.5px solid var(--ink); pointer-events: none; --ink: #1d2024; }
      #sheet::before { content: ''; position: absolute; inset: 5px; border: 0.75px solid var(--ink); opacity: .55; }
      body.drawing.has-sheet #sheet { display: block; }
      body.pal-blueprint #sheet { --ink: #e9f1fb; }
      #sheet .tb { position: absolute; right: 5px; bottom: 5px; display: grid; grid-template-columns: 92px 210px 70px 92px; font: 10px/1.25 ui-monospace, 'SF Mono', Menlo, monospace; color: var(--ink); border-top: 0.75px solid; border-left: 0.75px solid; letter-spacing: .5px; text-transform: uppercase; }
      #sheet .tb div { border-right: 0.75px solid; border-bottom: 0.75px solid; padding: 4px 6px; }
      #sheet .tb .k { opacity: .65; font-size: 8.5px; }
      #sheet .tb .big { grid-column: span 2; font: 700 15px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: 3px; }
      #sheet .tb .wide { grid-column: span 3; }
      #sheet .marks { position: absolute; left: 12px; top: 8px; font: 10px ui-monospace, Menlo, monospace; color: var(--ink); letter-spacing: 2px; opacity: .8; }
      body.drawing.has-sheet #ui { top: 30px; right: 30px; }
      /* the panel on the blueprint palette */
      body.drawing.pal-blueprint { background: #163e6e; }
      body.drawing.pal-blueprint #ui { background: rgba(10, 35, 66, .82); border-color: #3c6da3; color: #e9f1fb; }
      body.drawing.pal-blueprint #ui .sub, body.drawing.pal-blueprint #ui label { color: #a9c3e2; }
      body.drawing.pal-blueprint #ui label span, body.drawing.pal-blueprint #readout { color: #eef4fb; }
      body.drawing.pal-blueprint #views button { background: transparent; color: #e9f1fb; border-color: #3c6da3; }
      body.drawing.pal-blueprint #ui input[type=range] { accent-color: #e8b34a; }
      body.drawing.pal-blueprint #stats { color: #7ea3cc; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="sheet"></div>
    <div id="ui">
      <h1 id="name">model</h1>
      <div class="sub" id="desc"></div>
      <div id="readout"></div>
      <div id="params"></div>
      <div id="views"></div>
      <div id="stats"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
